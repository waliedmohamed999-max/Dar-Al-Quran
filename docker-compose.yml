name: dar-quran
# Development infrastructure by default. `--profile app` also runs the app and worker
# containers (see docs/OPERATIONS.md for staging/production).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dar_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_owner_password}
      POSTGRES_DB: ${POSTGRES_DB:-dar_quran}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5544}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-dev_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-dev_minio_password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3000:3000"

  worker:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
